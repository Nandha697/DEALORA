<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dealora</title><meta name="description" content="Product discovery with links to Indian retailers.">

<style>
:root{
  --ink:#241757;
  --paper:#F8F7FF;
  --card:#FFFFFF;
  --accent:#6C3BFF;
  --pop:#FF8A00;
  --mute:#70688F;
  --line:#E5DFFF;
  --r:18px;
}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(246,244,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--pop));display:inline-block;transform:rotate(-8deg)}
.logo img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  display: block;
}
nav{display:flex;gap:18px;margin-left:12px}nav a,nav button{background:none;border:0;cursor:pointer;font-weight:600;padding:6px 0}
nav a:hover,nav button:hover{color:var(--pop)}
.search{flex:1;min-width:200px;position:relative;order:3;flex-basis:100%}
@media(min-width:900px){.search{order:0;flex-basis:auto}}
.search input{width:100%;padding:12px 40px 12px 16px;border-radius:999px;border:2px solid var(--line);background:#fff}
.search input:focus{border-color:var(--accent);outline:0}
.search button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line);border-radius:50%;width:26px;height:26px;cursor:pointer}
.burger{display:none;margin-left:auto;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:8px 12px}
.menu{position:relative}.dd{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;width:min(720px,92vw);grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;box-shadow:0 20px 50px rgba(36,23,87,.18)}
.menu.open .dd{display:grid}.dd h4{margin:0 0 6px}.dd a{display:block;padding:3px 0;color:var(--mute)}.dd a:hover{color:var(--pop)}
@media(max-width:899px){.burger{display:block}nav{display:none;flex-basis:100%;flex-direction:column;margin:0}nav.show{display:flex}.dd{position:static;width:100%;box-shadow:none}}
.hero{padding:44px 0 28px;display:grid;gap:28px;align-items:center}
.hero{
  position:relative;
  padding:clamp(30px,5vw,64px);
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:32px;
  align-items:center;
  overflow:hidden;
  border:1px solid #e5defa;
  border-radius:28px;
  background:linear-gradient(135deg,#ffffff 0%,#f0eaff 55%,#fff0df 100%);
  box-shadow:0 18px 50px rgba(36,23,87,.08);
}
.hero h1{
  font-size:clamp(2.3rem,5vw,4.3rem);
  line-height:1.04;
  letter-spacing:-.04em;
  font-weight:800;
  margin:14px 0;
}
.hero h1 b{
  display:block;
  color:var(--accent);
}
.hero p{
  color:var(--mute);
  max-width:440px;
  font-size:1.08rem;
  line-height:1.7;
}
.hero-badge{
  display:inline-block;
  padding:8px 13px;
  border-radius:999px;
  background:#eee7ff;
  color:#6033db;
  font-size:.85rem;
  font-weight:800;
}
.hero-visual{
  min-height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-radius:24px;
  background:linear-gradient(145deg,#6c3bff,#382078);
  color:white;
  overflow:hidden;
}
.hero-visual:before,
.hero-visual:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.10);
}
.hero-visual:before{
  width:230px;height:230px;top:-70px;right:-40px;
}
.hero-visual:after{
  width:170px;height:170px;bottom:-80px;left:-35px;
}
.hero-offer{
  position:relative;
  z-index:1;
  text-align:center;
  padding:24px;
}
.hero-offer .bag{
  font-size:76px;
  line-height:1.3;
}
.hero-offer h3{
  font-size:1.8rem;
  margin:8px 0;
}
.hero-offer p{
  color:#eee7ff;
  margin:0 auto;
  font-size:1rem;
}
.hero .btn{
  margin-top:12px;
}
@media(max-width:700px){
  .hero{
    grid-template-columns:1fr;
    padding:24px;
    gap:22px;
  }
  .hero-visual{
    min-height:220px;
  }
  .hero-offer .bag{
    font-size:60px;
  }
}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(2.3rem,7vw,4.6rem);line-height:.95;letter-spacing:-.04em;font-weight:800;margin:0 0 16px}
.hero h1 b{display:block;color:var(--pop)}
.hero p{color:var(--mute);max-width:46ch;font-size:1.1rem}
.btn{display:inline-block;background:var(--ink);color:#fff;border:0;padding:13px 22px;border-radius:999px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px);background:var(--pop)}.btn.alt{background:var(--accent)}.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn[aria-disabled=true]{background:#bbb;pointer-events:none}
.stack{position:relative;height:280px}
.stack span{position:absolute;border-radius:28px;box-shadow:0 18px 40px rgba(36,23,87,.2);animation:fl 7s ease-in-out infinite}
.stack span:nth-child(1){inset:10% 28% 22% 0;background:var(--accent);transform:rotate(-7deg)}
.stack span:nth-child(2){inset:0 0 34% 36%;background:var(--pop);transform:rotate(6deg);animation-delay:-2s}
.stack span:nth-child(3){inset:46% 12% 0 18%;background:var(--ink);transform:rotate(-2deg);animation-delay:-4s}
@keyframes fl{50%{translate:0 -10px}}@media(prefers-reduced-motion:reduce){.stack span{animation:none}html{scroll-behavior:auto}}
section{padding:26px 0}h2{font-size:1.7rem;letter-spacing:-.02em;margin:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.chip.on,.chip:hover{border-color:var(--pop);color:var(--pop)}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dept{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;font-weight:700;display:block;transition:transform .15s,border-color .15s}
.dept:hover{transform:translateY(-3px);border-color:var(--accent)}.dept small{display:block;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(36,23,87,.14)}
.img{aspect-ratio:1;background:#ece8fb;display:grid;place-items:center;color:var(--mute);font-size:.85rem;position:relative}
.img img{width:100%;height:100%;object-fit:contain;background:#fff}
.off{position:absolute;top:8px;left:8px;background:var(--pop);color:#fff;border-radius:8px;padding:3px 8px;font-weight:700;font-size:.8rem}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:.98rem;margin:0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:1.25rem;font-weight:800}.pr s{font-size:.85rem;font-weight:400;color:var(--mute);margin-left:6px}
.ret{color:var(--mute);font-size:.85rem}.cb .btn{margin-top:auto;text-align:center;padding:10px}
.note{background:#fff;border:1px dashed var(--mute);border-radius:var(--r);padding:20px;color:var(--mute)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}select{padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.disc{font-size:.85rem;color:var(--mute);margin-top:18px;max-width:80ch}
footer{background:var(--ink);color:#d9d3f7;margin-top:40px;padding:34px 0}footer a{margin-right:16px;text-decoration:underline}
.detail{display:grid;gap:24px}@media(min-width:800px){.detail{grid-template-columns:1fr 1fr}}
.form{display:grid;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.form label{display:grid;gap:4px;font-weight:600;font-size:.9rem}.form input,.form select,.form textarea{padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.two{display:grid;gap:10px}@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.tw{overflow-x:auto}.err{color:#b00020;font-weight:600}.ok{color:#0a7a3d;font-weight:600}
.spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--pop);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}@keyframes sp{to{rotate:1turn}}

/* ===== DEALORA PURPLE + WHITE + ORANGE THEME ===== */

html {
  background: #F8F7FF;
}

body {
  background: #F8F7FF;
  color: #241757;
}

/* Header */
header {
  background: #FFFFFF;
  color: #241757;
  border-bottom: 1px solid #E5DFFF;
  box-shadow: 0 4px 18px rgba(50, 30, 100, 0.05);
}

/* Main headings */
h1, h2, h3 {
  color: #241757;
}

h2 {
  font-weight: 800;
}

/* Hero banner */
.hero {
  background: linear-gradient(
    135deg,
    #FFFFFF 0%,
    #F0EAFF 60%,
    #FFF0DF 100%
  );
  border: 1px solid #E5DFFF;
  border-radius: 28px;
  box-shadow: 0 18px 50px rgba(36, 23, 87, 0.08);
}

.hero h1 {
  color: #241757;
}

.hero h1 b {
  color: #6C3BFF;
}

.hero p {
  color: #70688F;
}

.hero-badge {
  background: #EEE7FF;
  color: #6033DB;
}

/* Hero visual */
.hero-visual {
  background: linear-gradient(145deg, #6C3BFF, #382078);
  border-radius: 24px;
}

.hero-offer h3 {
  color: #FFFFFF;
}

.hero-offer p {
  color: #EEE7FF;
}

/* Buttons */
.btn,
button {
  transition: all 0.2s ease;
}

.btn,
.hero .btn {
  background: #6C3BFF;
  color: #FFFFFF;
  border: none;
  font-weight: 800;
}

.btn:hover,
.hero .btn:hover {
  background: #FF8A00;
  color: #FFFFFF;
  transform: translateY(-2px);
}

/* Product cards */
.product,
.product-card,
.card {
  background: #FFFFFF;
  border-color: #E5DFFF;
  border-radius: 18px;
}

/* Department cards */
.dept {
  background: #FFFFFF;
  color: #241757;
  border: 1px solid #E5DFFF;
  border-radius: 16px;
  transition: all 0.2s ease;
}

.dept:hover {
  border-color: #6C3BFF;
  box-shadow: 0 8px 24px rgba(108, 59, 255, 0.10);
  transform: translateY(-3px);
}

/* Links */
a {
  transition: color 0.2s ease;
}

a:hover {
  color: #FF8A00;
}

/* Price highlights */
.price,
.product-price {
  color: #6C3BFF;
  font-weight: 800;
}

/* Sale labels */
.badge,
.sale,
.discount {
  background: #FFF0DF;
  color: #C45B00;
}

/* Inputs and dropdowns */
input,
select,
textarea {
  background: #FFFFFF;
  color: #241757;
  border: 1px solid #DDD4FA;
  border-radius: 10px;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #6C3BFF;
  outline-offset: 1px;
}

/* Chips and filters */
.chip {
  background: #FFFFFF;
  color: #6033DB;
  border: 1px solid #DDD4FA;
}

.chip:hover {
  background: #EEE7FF;
  border-color: #6C3BFF;
}

/* Footer */
footer {
  background: #241757;
  color: #FFFFFF;
  border-top: 3px solid #FF8A00;
}

footer a {
  color: #EEE7FF;
}

footer a:hover {
  color: #FF8A00;
}

/* Mobile responsive */
@media (max-width: 700px) {
  .hero {
    border-radius: 20px;
  }

  .hero-visual {
    border-radius: 18px;
  }
}
/* ===== DEALORA PRODUCT CARD UPGRADE ===== */

.product,
.product-card,
.card {
  background: #FFFFFF;
  border: 1px solid #E9E2FF;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 5px 18px rgba(36, 23, 87, 0.05);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.product:hover,
.product-card:hover,
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 14px 30px rgba(108, 59, 255, 0.13);
  border-color: #C7B5FF;
}

.product img,
.product-card img,
.card img {
  max-width: 100%;
  object-fit: contain;
}

.price,
.product-price {
  color: #6C3BFF;
  font-size: 1.15rem;
  font-weight: 800;
}

.badge,
.sale,
.discount {
  background: #FFF0DF;
  color: #C45B00;
  border-radius: 20px;
  padding: 5px 10px;
  font-weight: 700;
}

button,
.btn {
  border-radius: 12px;
  cursor: pointer;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #FF8A00;
  outline-offset: 3px;
}
/* ===== DEALORA PREMIUM PRODUCT CARDS ===== */

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 24px;
  align-items: stretch;
}

.dealora-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: #FFFFFF;
  border: 1px solid #E8E1FF;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(36, 23, 87, 0.06);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.dealora-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 32px rgba(108, 59, 255, 0.13);
  border-color: #C8B8FF;
}

.dealora-product-image {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 220px;
  padding: 18px;
  overflow: hidden;
  background: #FFFFFF;
  box-sizing: border-box;
}

.dealora-product-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 0.3s ease;
}

.dealora-card:hover .dealora-product-image img {
  transform: scale(1.05);
}

.no-image {
  color: #8B82A8;
  font-size: 14px;
  text-align: center;
}

.dealora-off {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 7px 11px;
  border-radius: 8px;
  background: #FF8A00;
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 800;
  box-shadow: 0 3px 10px rgba(196, 91, 0, 0.16);
}

.dealora-card-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  padding: 18px;
}

.dealora-product-name {
  margin: 0;
  color: #241757;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.dealora-product-name a {
  color: inherit;
  text-decoration: none;
}

.dealora-product-name a:hover {
  color: #6C3BFF;
}

.dealora-price {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 9px;
  color: #6C3BFF;
  font-size: 21px;
  font-weight: 850;
}

.dealora-price s {
  color: #9991AE;
  font-size: 14px;
  font-weight: 500;
}

.dealora-retailer {
  color: #77708D;
  font-size: 13px;
}

.dealora-deal-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  margin-top: auto;
  padding: 12px 16px;
  box-sizing: border-box;
  border: none;
  border-radius: 11px;
  background: #6C3BFF;
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 800;
  text-align: center;
  text-decoration: none;
  transition: background 0.2s ease, transform 0.2s ease;
}

.dealora-deal-btn:hover {
  background: #FF8A00;
  color: #FFFFFF;
  transform: translateY(-1px);
}

.dealora-deal-disabled {
  display: block;
  margin-top: auto;
  padding: 12px;
  border-radius: 11px;
  background: #EEEAF5;
  color: #77708D;
  text-align: center;
}

/* Tablet */
@media (max-width: 1000px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .dealora-product-image {
    height: 200px;
  }

  if (a.error || b.error) {
    app.innerHTML = `<div class="note err">

  }

}
const pub=()=>P.filter(p=>p.published);

function home(){
 setTitle('');const l=pub(),d=depts(),feat=l.filter(p=>p.featured).slice(0,8);
 app.innerHTML=`<div class="hero">
  <div>

    <a class="btn" href="#/all">Explore Deals →</a>
  </div>
  <div class="hero-visual">
    <div class="hero-offer">
  <img
    class="hero-logo"
    src="https://fyqskrkplwrbinirtldo.supabase.co/storage/v1/object/public/dealora-assets/Dealora%20Shop%20Smart%20Logo.png"
    alt="Dealora Shop Smart Logo">
  <h3>Shop Smart.</h3>
  <p>Discover your next favourite find.</p>
</div>
  </div>
</div>
 <section><h2>Departments</h2><div class="depts">${Object.keys(d).map(k=>`<a class="dept" href="#/d/${slug(k)}">${esc(k)}<small>${d[k].reduce((s,c)=>s+c.n,0)} products</small></a>`).join('')||'<div class="note">Departments appear once products are added.</div>'}</div></section>
 ${feat.length?`<section><h2>Trending products</h2>${grid(feat)}</section>`:''}
 <section><h2>Latest additions</h2>${grid(l.slice(0,8))}</section>
 <section><h2>Browse by budget</h2><div class="chips">${CONFIG.budgets.map(b=>`<a class="chip" href="#/budget/${b}">Under ${inr(b)}</a>`).join('')}</div></section>
 <section><h2>All products</h2>${browser(l)}</section>${disc()}`;wireBrowser(l)}
function browser(l){const subs=[...new Set(l.map(p=>p.subcategory))];return `<div class="toolbar"><select id="fc" aria-label="Category"><option value="">All categories</option>${subs.map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="fs" aria-label="Sort"><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="off">Biggest verified discount</option></select></div><div id="bl">${grid(l)}</div>`}
function wireBrowser(l){const f=()=>{const c=$('#fc').value;$('#bl').innerHTML=grid(sorter(l.filter(p=>!c||p.subcategory===c),$('#fs').value))};$('#fc').onchange=$('#fs').onchange=f}
function list(title,l,extra=''){setTitle(title);app.innerHTML=`<section><h2>${esc(title)}</h2>${extra}${browser(l)}</section>${disc()}`;wireBrowser(l)}
function search() {
  const t = query.trim().toLowerCase();
  setTitle('Search');

  const r = pub().filter(p => {
    const name = String(p.name || '').toLowerCase();
    const category = String(p.category || '').toLowerCase();
    const subcategory = String(p.subcategory || '').toLowerCase();

    return (
      name.includes(t) ||
      category.includes(t) ||
      subcategory.includes(t)
    );
  });

  app.innerHTML = `
    <section>
      <h2>Results for "${esc(query)}"</h2>
      ${
        r.length
          ? grid(r)
          : `<div class="note">
              No matching products found.
              Try another product name or category.
            </div>`
      }
    </section>
    ${disc()}
  `;
}
function detail(id){const p=P.find(x=>x.id===id&&(x.published||session));if(!p){setTitle('Not found');app.innerHTML=`<div class="note"><h2>Product not found</h2><a class="btn" href="#/">Back home</a></div>`;return}
 setTitle(p.name,p.description?.slice(0,150));const ok=p.affiliate_url&&okUrl(p.affiliate_url);
 app.innerHTML=`<section class="detail"><div class="card"><div class="img">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'No image'}</div></div><div><p class="ret">${esc(p.category)} / ${esc(p.subcategory)}</p><h1>${esc(p.name)}</h1><div class="pr">${inr(p.price)}${verified(p)?`<s>${inr(p.original_price)}</s> ${pct(p)}% off`:''}</div><p>${esc(p.description)}</p><p class="ret">Sold by ${esc(p.retailer)}${p.last_verified?`. Price last checked ${esc(p.last_verified)}.`:'.'}</p>
 ${ok?`<a class="btn alt" href="${esc(p.affiliate_url)}" target="_blank" rel="sponsored noopener noreferrer">View Deal</a>`:`<span class="btn" aria-disabled="true">Link unavailable</span>${session?'<p class="err">Admin notice: this product has no valid affiliate link.</p>':''}`}${disc()}</div></section>`}
const PAGES={about:['About Us','We help shoppers in India discover products and link them to the retailer that sells them. We do not sell products ourselves.'],contact:['Contact',CONFIG.contact],privacy:['Privacy Policy','Replace with your privacy policy. Mention that retailers and affiliate networks may set cookies when you click through.'],terms:['Terms and Conditions','Replace with your terms. Purchases happen on retailer websites under their terms.'],disclosure:['Affiliate Disclosure',DISCLOSURE]};
// ---------- Admin ----------
async function isAdmin(){
  if(!session) return false;

  const {data, error} = await sb
    .from('admins')
    .select('user_id')
    .eq('user_id', session.user.id);

  if(error){
    console.error("Admin check error:", error);
    app.innerHTML = `
      <div class="note err">
        Admin check failed: ${esc(error.message)}
      </div>`;
    return false;
  }

  console.log("Logged-in user ID:", session.user.id);
  console.log("Admin records:", data);

  return !!data?.length;
}
async function admin(){setTitle('Admin');
 if(!session){app.innerHTML=`<form class="form" id="lf" style="max-width:380px;margin:30px auto"><h2>Admin login</h2><label>Email<input name="e" type="email" required autocomplete="username"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><button class="btn">Log in</button><p class="err" id="le"></p></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const f=e.target;const {data,error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});if(error)return $('#le').textContent=error.message;session=data.session;route()};return}
 if(!await isAdmin()){app.innerHTML=`<div class="note err">This account is not an administrator.</div><button class="btn" id="lo">Log out</button>`;$('#lo').onclick=out;return}
 app.innerHTML=`<section><div class="toolbar"><h2 style="margin:0;flex:1">Admin dashboard</h2><button class="btn alt" id="nw">Add product</button><button class="btn ghost" id="nc">Add category</button><button class="btn" id="lo">Log out</button></div><div id="msg"></div><div id="ed"></div>
 <div class="tw"><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Link</th><th>Status</th><th></th></tr>${P.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.subcategory)}</td><td>${inr(p.price)}</td><td>${p.affiliate_url&&okUrl(p.affiliate_url)?'OK':'<span class="err">Missing</span>'}</td><td>${p.featured?'Featured ':''}${p.published?'':'Hidden'}</td><td><button class="chip" data-e="${esc(p.id)}">Edit</button> <button class="chip" data-d="${esc(p.id)}">Delete</button></td></tr>`).join('')}</table></div></section>`;
 $('#lo').onclick=out;$('#nw').onclick=()=>form();$('#nc').onclick=catForm;
 app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(P.find(p=>p.id===b.dataset.e)));
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this product permanently?'))return;const {error}=await sb.from('products').delete().eq('id',b.dataset.d);if(error)return msg(error.message,1);await load();admin();msg('Product deleted.')})}
const msg=(t,e)=>{$('#msg').innerHTML=`<p class="${e?'err':'ok'}">${esc(t)}</p>`};
async function out(){await sb.auth.signOut();session=null;location.hash='#/'}
function catForm(){$('#ed').innerHTML=`<form class="form" id="cf"><h3>New category</h3><div class="two"><label>Department<input name="d" list="dl" required></label><label>Subcategory<input name="n" required></label></div><datalist id="dl">${[...new Set(C.map(c=>c.department))].map(d=>`<option>${esc(d)}`).join('')}</datalist><label><span><input type="checkbox" name="v"> Keep visible when empty</span></label><button class="btn">Save category</button></form>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();const f=e.target;const {error}=await sb.from('categories').insert({department:f.d.value.trim(),name:f.n.value.trim(),always_visible:f.v.checked});if(error)return msg(error.message,1);await load();admin();msg('Category added.')}}
function form(p){const n=!p;p=p||{currency:'INR',published:true};const deps=[...new Set(C.map(c=>c.department))];
 $('#ed').innerHTML=`<form class="form" id="pf"><h3>${n?'Add':'Edit'} product</h3>
 <div class="two"><label>Product ID<input name="id" value="${esc(p.id||'')}" ${n?'':'readonly'} pattern="[a-z0-9\\-]{3,60}" placeholder="product-001" required></label><label>Name<input name="name" value="${esc(p.name||'')}" required></label>
 <label>Department<select name="category">${deps.map(d=>`<option ${d===p.category?'selected':''}>${esc(d)}`).join('')}</select></label><label>Subcategory<select name="subcategory"></select></label>
 <label>Current price (₹)<input name="price" type="number" min="0" step="1" value="${p.price??''}" required></label><label>Original price (₹, only if verified)<input name="original_price" type="number" min="0" step="1" value="${p.original_price??''}"></label>
 <label>Retailer<input name="retailer" value="${esc(p.retailer||'')}" required placeholder="Flipkart"></label><label>Last verified<input name="last_verified" type="date" value="${p.last_verified||''}"></label></div>

 <label>Image<input name="file" type="file" accept="image/*"></label><label>Or image URL<input name="image" value="${esc(p.image||'')}"></label>

 <label><span><input type="checkbox" name="featured" ${p.featured?'checked':''}> Featured (Trending)</span></label><label><span><input type="checkbox" name="published" ${p.published?'checked':''}> Published</span></label>
 <div><button class="btn">Save product</button> <button type="button" class="btn ghost" id="cx">Cancel</button></div></form>`;
 const f=$('#pf'),fill=()=>f.subcategory.innerHTML=C.filter(c=>c.department===f.category.value).map(c=>`<option ${c.name===p.subcategory?'selected':''}>${esc(c.name)}`).join('');fill();f.category.onchange=fill;$('#cx').onclick=()=>$('#ed').innerHTML='';
 f.onsubmit=async e=>{e.preventDefault();const u=f.affiliate_url.value.trim();if(u&&!okUrl(u))return msg('Affiliate link must be https and on an approved domain (CONFIG.allowedHosts).',1);
  const price=+f.price.value,op=f.original_price.value?+f.original_price.value:null;if(op!==null&&op<=price)return msg('Original price must be higher than current price, or leave it empty.',1);
  let image=f.image.value.trim()||null;const file=f.file.files[0];
  if(file){if(file.size>3e6)return msg('Image must be under 3 MB.',1);const path=`${f.id.value}-${Date.now()}.${file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'')}`;const up=await sb.storage.from('product-images').upload(path,file);if(up.error)return msg(up.error.message,1);image=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}
  const row={id:f.id.value,name:f.name.value.trim(),category:f.category.value,subcategory:f.subcategory.value,price,original_price:op,retailer:f.retailer.value.trim(),image,description:f.description.value.trim(),affiliate_url:u||null,last_verified:f.last_verified.value||null,featured:f.featured.checked,published:f.published.checked};
  const {error}=n?await sb.from('products').insert(row):await sb.from('products').update(row).eq('id',row.id);if(error)return msg(error.message,1);await load();admin();msg('Product saved.')}}
// ---------- Router ----------
async function route(){
 if(!ready){app.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';if(!await load())return}
 $('#nav').classList.remove('show');$('#dm').classList.remove('open');window.scrollTo(0,0);
 const [,a,b]=location.hash.split('/');const l=pub();
 if(query.trim()&&a!=='admin')return search();
 if(!a)return home();
 if(a==='admin')return admin();
 if(a==='all')return list('All products',l);
 if(a==='deals')return list("Today's deals",l.filter(verified).sort((x,y)=>pct(y)-pct(x)),'<p class="ret">Only products with a verified original price are listed.</p>');
 if(a==='trending')return list('Trending products',l.filter(p=>p.featured));
 if(a==='budget')return list('Under '+inr(+b),l.filter(p=>p.price<=+b));
 if(a==='d'){const D=[...new Set(C.map(c=>c.department))].find(d=>slug(d)===b);return D?list(D,l.filter(p=>p.category===D)):detail('')}
 if(a==='c'){const c=C.find(c=>slug(c.name)===b);return c?list(c.name,l.filter(p=>p.subcategory===c.name&&p.category===c.department)):detail('')}
 if(a==='p')return detail(b);
 if(a==='page'&&PAGES[b]){setTitle(PAGES[b][0]);app.innerHTML=`<section><h2>${PAGES[b][0]}</h2><p style="max-width:70ch">${esc(PAGES[b][1])}</p></section>`;return}
 detail('')}
$('#q').oninput=e=>{query=e.target.value;$('#qc').hidden=!query;route()};
